<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="icon" type="image/png" href="img/logo-fav.png">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Coffee House - Menu</title>
    <script src="script/script.js" defer></script>
    <script src="script/menu.js" type="module"></script>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-container">
                <div class="header-logo">
                    <a href="index.html"> <img src="img/logo.svg" alt="logo"></a>
                </div>
                <nav class="header-nav">
                    <ul class="header-list">
                        <li class="header-li"><a class="header-link link" href="#favorite">Favorite coffee</a></li>
                        <li class="header-li"><a class="header-link link" href="#about">About</a></li>
                        <li class="header-li"><a class="header-link link" href="index.html">Mobile app</a></li>
                        <li class="header-li"><a class="header-link link" href="#contact">Contact us</a></li>
                        <li class="header-coffee-menu header-link menu-burger">
                            <div class="coffee-menu-text">
                                <a class="link" href="menu.html">Menu</a>
                            </div>
                            <div class="coffee-menu-logo">
                                <img src="img/coffee-cup.svg" alt="coffee-cup">
                            </div>
                        </li>
                    </ul>
                </nav>
                <div class="header-right">
                    <div class="header-theme-switch">
                        <div class="switch-light active-theme">
                            <span></span>
                        </div>
                        <div class="switch-dark">
                            <span></span>
                        </div>
                    </div>
                    <div class="header-coffee-menu header-link header-link-menu">
                        <div class="coffee-menu-text">
                            <a class="header-link-menu" href="#">Menu</a>
                        </div>
                        <div class="coffee-menu-logo">
                            <img src="img/coffee-cup.svg" alt="coffee-cup">
                        </div>
                    </div>
                    <div class="header-menu-burger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="main">
        <section class="offer">
            <div class="container">
                <h1 class="offer-title title">
                    Behind each of our cups hides an <span>
                        amazing surprise
                    </span>
                </h1>
                <div class="offer-tabs">
                    <div class="offer-tabs-container">
                        <div data-category="coffee" class="offer-tab-container">
                            <div class="offer-tab-emoji">
                                ☕
                            </div>
                            <div class="offer-tab-text">
                                Coffee
                            </div>
                        </div>
                        <div data-category="tea" class="offer-tab-container">
                            <div class="offer-tab-emoji">
                                🫖
                            </div>
                            <div class="offer-tab-text">
                                Tea
                            </div>
                        </div>
                        <div data-category="dessert" class="offer-tab-container">
                            <div class="offer-tab-emoji">
                                🍰
                            </div>
                            <div class="offer-tab-text">
                                Dessert
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="main-menu">
            <div class="container">
                <div class="menu-container">
                    <div class="menu-items">

                    </div>
                </div>
            </div>
            <div class="btn-refresh">
            </div>
        </section>
    </main>
    <footer class="footer" id="contact">
        <div class="container">
            <div class="footer-container">
                <div class="footer-content">
                    <h2 class="footer-title title">
                        Sip, Savor, Smile. <span>
                            It’s coffee time!
                        </span>
                    </h2>
                    <div class="footer-icons">
                        <a class="footer-icon" href="https://x.com/?lang=ru">
                            <img src="img/twitter.svg" alt="twitter-icon">
                        </a>
                        <a class="footer-icon " href="https://www.instagram.com/">
                            <img src=" img/instagram.svg" alt="instagram">
                        </a>
                        <a class="footer-icon" href="https://www.facebook.com/?locale=ru_RU">
                            <img src="img/facebook.svg" alt="facebook-icon">
                        </a>
                    </div>
                </div>
                <div class="footer-content-contact">
                    <div class="footer-contact-text">Contact us</div>
                    <div class="footer-contact">
                        <ul class="footer-list">
                            <li class="footer-link">8558 Green Rd., LA</li>
                            <li class="footer-link"><a href="tel:+16035550123">+1 (603) 555-0123</a></li>
                            <li class="footer-link">Mon–Sat: 9:00–23:00</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
