<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="icon" type="image/png" href="img/logo-fav.png">
    <title>Coffee House - Menu</title>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header-container">
                <div class="header-logo">
                    <a href="#"> <img src="img/logo.svg" alt="logo"></a>
                </div>
                <nav class="header-nav">
                    <ul class="header-list">
                        <li class="header-li"><a class="header-link link" href="#favorite">Favorite coffee</a></li>
                        <li class="header-li"><a class="header-link link" href="#about">About</a></li>
                        <li class="header-li"><a class="header-link link" href="#mobile-app">Mobile app</a></li>
                        <li class="header-li"><a class="header-link link" href="#contact">Contact us</a></li>
                    </ul>
                </nav>
                <div class="header-right">
                    <div class="header-theme-switch">
                        <div class="switch-light">
                            <span></span>
                        </div>
                        <div class="switch-dark">
                            <span></span>
                        </div>
                    </div>
                    <div class="header-coffee-menu">
                        <div class="coffee-menu-text">
                            <a class="header-link link menu-menu" href="#">Menu</a>
                        </div>
                        <div class="coffee-menu-logo">
                            <img src="img/coffee-cup.svg" alt="coffee-cup">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="main">
        <seсtion class="offer">
            <div class="container">
                <h1 class="offer-title title">
                    Behind each of our cups hides an <span class="span">
                        amazing surprise
                    </span>
                </h1>
                <div class="offer-tabs">
                    <div class="offer-tabs-container">
                        <div class="offer-tab-container">
                            <div class="offer-tab-emoji">
                                ☕
                            </div>
                            <div class="offer-tab-text">
                                Coffee
                            </div>
                        </div>
                        <div class="offer-tab-container">
                            <div class="offer-tab-emoji">
                                🫖
                            </div>
                            <div class="offer-tab-text">
                                Tea
                            </div>
                        </div>
                        <div class="offer-tab-container">
                            <div class="offer-tab-emoji">
                                🍰
                            </div>
                            <div class="offer-tab-text">
                                Dessert
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </seсtion>
    </main>
</body>

</html>
